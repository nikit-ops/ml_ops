version: "3.8"
services: 
  app:
    build: ./app/
    image: ml-task-api:latest
    container_name: ml-task-api
    restart: no
    # RESTORE!
    # restart: unless-stopped
    env_file:
      - ./app/.env
    volumes:
      - ./app:/app
    networks:
      - ml-task-network
    depends_on:
      - database
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # web-proxy:
  #   image: nginx:1.27.4
