  #     app:
  #       condition: service_healthy
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  #     # - ./nginx/ssl:/etc/nginx/ssl
  #   networks:
  #     - ml-task-network

  # rabbitmq:
  #   image: rabbitmq:4.0.8-management
  #   container_name: ml-task-rabbitmq
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"
  #   volumes:
  #     - rabbitmq_data:/var/lib/rabbitmq
  #   restart: on-failure
  #   networks:
  #     - ml-task-network

  database:
    image: postgres:17.4
    container_name: ml-task-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - ml-task-network

networks:
  ml-task-network:
    name: ml-task-network
    driver: bridge

volumes:
  postgres_data:
  # rabbitmq_data: